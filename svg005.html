<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5231932_9ea2h4mx727.js"></script>
    <link rel="stylesheet" href="./css/svg005.css">
    <style>
.icon {
  width: 1em;
  height: 1em;
  vertical-align: -0.15em;
  fill: currentColor;
  overflow: hidden;
}
</style>
</head>
<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-a-ziyuan253"></use>
            </svg>
            <span>小风扇</span>
            <!--div.budge-dot回车 .budge-dot-->
            <div class="budge-dot" id="budge-dot-1"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-niuyouguo"></use>
            </svg>
            <span>牛油果</span>
            <div class="budge-num" id="budge-plan">6</div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-gongwenbao"></use>
            </svg>
            <span>百宝箱</span>
            <div class="budge-border" id="budge-collect"></div>
        </div>
        <div class="tab-item">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-gongwenbao"></use>
            </svg>
            <span>百宝箱</span>
            <div class="budge-dot max" id="budge-my">100+</div>
        </div>
    </div>
      <script>
        // 写一个函数，当我点击当天的item时候，颜色发生变化
        function changeTab(current) {
            let tabs = document.querySelectorAll(".tab-item");
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }
            current.classList.add("active");
        }
    </script>
</body>
</html>
