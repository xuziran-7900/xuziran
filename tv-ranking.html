<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
┌─────────────────────────────────────────────────┐
│ 作者: 徐子然 (xu-ziran)                         │
│ 建立时间: 2026-11-04                            │
│ 使用大模型: Trae (proprietary model from Trae team) │
│ 功能名称: 视频热播排行榜 · 每日/每周/每月/全部 四 Tab │
└─────────────────────────────────────────────────┘
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热播榜</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* ✅ 画布 275 × 204 */
  .xzr_rank_tab_container {
    width: 275px;
    height: 204px;
    background: #ffffff;
  }

  /* ========== Tab 栏 ========== */
  /* ✅ 白底，没有整体底色，只有底部分隔细线 */
  .xzr_rank_tab_nav {
    display: flex;
    border-bottom: 1px solid #dddddd;
    background: #ffffff;
  }
  /* ✅ 未选中：白底 + 1px 灰色边框 + 深灰字 */
  .xzr_rank_tab-item {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #bbbbbb;
    background: #ffffff;
    color: #444444;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
    margin: 3px 2px -1px 2px;
    border-bottom: none;       /* 让底部分隔线盖住下边框 */
  }
  /* ✅ 选中：深灰填充 + 白字 + 无边框（深灰块直接盖在底线上） */
  .xzr_rank_tab-item.xzr_active {
    color: #ffffff;
    background: #4a4a4a;
    border-color: #4a4a4a;
    border-radius: 0;
  }

  /* ========== Tab 内容 ========== */
  .xzr_rank_tab-pane { display: none; }
  .xzr_rank_tab-pane.xzr_active { display: block; }

  /* ========== 两列榜单 ========== */
  .xzr_rank_list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 6px 4px 0 4px;
  }
  .xzr_rank_row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 4px;
  }

  /* ✅ 排名号：1-3 红 / 4-10 灰 */
  .xzr_rank_num {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: #bbbbbb;       /* 4~10 浅灰 */
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .xzr_rank_num.xzr_num_red {
    background: #e74c3c;       /* 1~3 红 */
  }

  .xzr_rank_title {
    font-size: 12px;
    color: #222222;
    font-weight: 400;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

<div class="xzr_rank_tab_container xzr_tab_container" id="xzr_rank_tab">

  <nav class="xzr_rank_tab_nav" role="tablist">
    <button class="xzr_rank_tab-item xzr_tab-item xzr_default" data-target="xzr_pane_daily" role="tab">每日</button>
    <button class="xzr_rank_tab-item xzr_tab-item" data-target="xzr_pane_weekly" role="tab">每周</button>
    <button class="xzr_rank_tab-item xzr_tab-item" data-target="xzr_pane_monthly" role="tab">每月</button>
