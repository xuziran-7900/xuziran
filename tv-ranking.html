<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
┌─────────────────────────────────────────────────┐
│ 作者: 徐子然 (xu-ziran)                         │
│ 建立时间: 2026-11-04                            │
│ 使用大模型: Trae (proprietary model from Trae team) │
│ 功能名称: 视频热播排行榜 · 每日/每周/每月/全部 四 Tab 切换 │
└─────────────────────────────────────────────────┘
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>tv-ranking · 视频热播榜</title>
<style>
  /* ========== 基础重置 ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: #ffffff;
    color: #222;
    min-height: 100vh;
  }
  a { text-decoration: none; color: inherit; }

  /* ========== 返回首页按钮 ========== */
  .xzr_back-home {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 16px; border-radius: 18px;
    background: rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.1);
    color: #555; font-size: 13px;
    transition: all 0.25s ease;
  }
  .xzr_back-home:hover { background: rgba(0,0,0,0.1); color: #222; }

  /* ========== 页面外层容器 ========== */
  .xzr_page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  /* ========== 大标题区 ========== */
  .xzr_page-title {
    padding: 72px 0 20px;
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 2px;
    text-align: center;
  }

  /* ========== Tab 栏 ========== */
  .xzr_rank_tab_container {
    border-bottom: 1px solid #e8e8e8;
    margin-bottom: 24px;
  }
  .xzr_rank_tab_nav {
    display: flex;
    gap: 0;
  }
  /* 单个 Tab 头 */
  .xzr_rank_tab-item {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: transparent;
    color: #888;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    position: relative;
    transition: color 0.25s ease;
  }
  .xzr_rank_tab-item:hover { color: #444; }
  /* ✅ 选中态：深灰胶囊背景 + 白色文字 + 底部无下划线（胶囊代替） */
  .xzr_rank_tab-item.xzr_active {
    color: #ffffff;
    background: #2c2c2e;
    border-radius: 6px;
    margin: 0 2px;
  }
  /* Tab 胶囊左右 margin 补偿选中态圆角 */
  .xzr_rank_tab-item:not(.xzr_active) {
    margin: 0 4px;
  }
  .xzr_rank_tab-item.xzr_active:first-child { margin-left: 0; }
  .xzr_rank_tab-item.xzr_active:last-child  { margin-right: 0; }

  /* ========== Tab 内容面板 ========== */
  .xzr_rank_tab-pane { display: none; }
  .xzr_rank_tab-pane.xzr_active {
    display: block;
    animation: xzr_rankFade 0.3s ease;
  }
  @keyframes xzr_rankFade {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ========== 两列排行榜布局 ========== */
  .xzr_rank_grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 28px;
    row-gap: 0;
  }

  /* 单行排名（左列 / 右列项结构完全相同） */
  .xzr_rank-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .xzr_rank-row:hover { background: rgba(0,0,0,0.02); }

  /* 排名数字：红底白字圆角方块 */
  .xzr_rank-num {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 4px;
    background: #e74c3c;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  /* 前 3 名略大一丢丢，视觉强调（图片中所有 1-10 数字块大小一致） */
  .xzr_rank-row:nth-child(3n+1) .xzr_rank-num { /* no-op, 预留 */ }

  /* 剧名 */
  .xzr_rank-title {
    font-size: 15px;
    color: #1a1a1a;
    font-weight: 500;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ========== 移动端适配 ========== */
  @media (max-width: 480px) {
    .xzr_rank_grid { column-gap: 14px; }
    .xzr_rank-title { font-size: 13px; }
    .xzr_rank-num { width: 20px; height: 20px; font-size: 11px; }
    .xzr_rank-row { gap: 8px; padding: 10px 0; }
    .xzr_page-title { font-size: 22px; padding-top: 56px; }
  }
</style>
</head>
<body>

<!-- 返回作品集首页 -->
<a href="index.html" class="xzr_back-home">← 作品集</a>

      - Tab 头用 .xzr_rank_tab-item（加 xzr_tab-item 类供 JS 识别）
